name: shared_ui
description: Shared UI components and helpers for the Bluejay project.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  url_launcher: ^6.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # Firebase
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.2.0
  firebase_auth: ^6.1.1

  # Internal
  bluejay_design:
    path: ../bluejay_design
  shared_services:
    path: ../shared_services

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Same pin as shared_services: 4.5+ requires cloud_firestore 7.
  fake_cloud_firestore: ">=4.4.0 <4.5.0"
  flutter_lints: ^6.0.0
