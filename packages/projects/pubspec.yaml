name: projects
description: A minimal project and blocker management package for Bluejay.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.0.3
  cloud_functions: ^6.2.0
  firebase_auth: ^6.1.1
  file_picker: ^8.0.5
  url_launcher: ^6.1.5

  shared_services:
    path: ../shared_services
  shared_ui:
    path: ../shared_ui
  bluejay_design:
    path: ../bluejay_design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
