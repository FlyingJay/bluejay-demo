name: dev_queue
description: Your queue — each person's development requests, from Up next through Live, plus the shared status words ticket screens show.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.0.3
  cloud_functions: ^6.2.0
  firebase_auth: ^6.1.1
  url_launcher: ^6.1.5

  bluejay_design:
    path: ../bluejay_design
  shared_services:
    path: ../shared_services

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 4.5+ requires cloud_firestore 7.
  fake_cloud_firestore: ">=4.4.0 <4.5.0"
