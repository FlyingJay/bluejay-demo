name: notes
description: A simple package for taking private, user-specific notes.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1

  # Local packages
  bluejay_design:
    path: ../bluejay_design
  shared_services:
    path: ../shared_services
  shared_ui:
    path: ../shared_ui

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
